# Configurazione per RealSense D435i (Adattata a 640x480 @ 15FPS)
Camera:
  name: "RealSense D435i"
  setup: "RGBD"
  model: "perspective"
  
  # I parametri focali scalano con la risoluzione
  fx: 322.0   # Dimezzato (era 644)
  fy: 322.0   # Dimezzato (era 644)
  cx: 320.0   # Centro di 640
  cy: 240.0   # Centro di 480
  
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0
  
  fps: 15.0    # Importante: deve coincidere con la camera!
  cols: 640    # Risoluzione VGA
  rows: 480    # Risoluzione VGA
  
  color_order: "RGB" # Se i colori sono invertiti, cambia in "BGR" qui

Feature:
  max_num_keypoints: 2000
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Depth:
  min_depth: 0.5
  max_depth: 5.0