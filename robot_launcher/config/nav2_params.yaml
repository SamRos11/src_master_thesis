bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/global
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Relaxed XY tolerance to avoid micro-adjustments at 1.8m
      xy_goal_tolerance: 0.3
      # CRITICAL: 3.14 means the robot ignores the final orientation, preventing the "S" parking curve
      yaw_goal_tolerance: 3.14 

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      max_linear_accel: 0.3
      # Stronger deceleration to stop cleanly at the 1.8m mark
      max_linear_decel: 0.8
      regulated_linear_vel_scaling: true 
      control_frequency: 20.0
      # Ackermann constraints
      min_turning_radius: 0.8    
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_min_vel: 0.1
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      use_rotate_to_heading: false
      allow_reversing: true
      use_regulated_linear_velocity_scaling: true
      # Minimum speed to overcome static friction (stiction) during tight turns
      regulated_linear_vel_scaling_min_speed: 0.15

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      # Ackermann footprint
      footprint: "[ [0.4, 0.15], [0.4, -0.15], [-0.05, -0.15], [-0.05, 0.15] ]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.1

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: false
      width: 60
      height: 60
      origin_x: -30.0
      origin_y: -30.0
      resolution: 0.05
      # Matches the local footprint logic for consistency
      footprint: "[ [0.4, 0.15], [0.4, -0.15], [-0.05, -0.15], [-0.05, 0.15] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.1

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Reverted to NavfnPlanner for fast, point-to-point path generation
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Left empty as we handle aborts via Action Client cancellations
    recovery_plugins: ["backup"]
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    
    # Configurazione della retromarcia di emergenza
    backup:
      plugin: "nav2_recoveries/BackUp"
      max_linear_vel: 0.2      # Velocità massima indietro
      min_linear_vel: 0.05
      max_rotational_vel: 0.0  # Va dritto all'indietro
      linear_acc_lim: 0.5
      travel_distance: 0.4     # Se si incastra in curva, fa 40cm indietro
      travel_duration: 5.0
      reverse_speed: -0.2      # Velocità in retromarcia