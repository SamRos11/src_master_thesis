# FILE: config.yaml - Versione Strutturalmente Corretta

#==============#
# Camera Model #
#==============#

Camera:
    name: "Turtlebot3_Simulated_RGBD"
    setup: "monocular"
    model: perspective 
    
    fx: 530.4669406576809 
    fy: 530.4669406576809
    cx: 320.5
    cy: 240.5

    cols: 640
    rows: 480
    
    fps: 30.0 
    color_order: RGB 
    
    distortion_model: radtan 
    k1: 0.0 
    k2: 0.0
    k3: 0.0
    k4: 0.0
    p1: 0.0
    p2: 0.0

#================#
# ORB Parameters #
#================#

Feature:
    max_num_keypoints: 3500
    scale_factor: 1.2
    num_levels: 8
    ini_fast_threshold: 20
    min_fast_threshold: 7

#======================#
# FramePublisher Setup #
#======================#

FramePublisher:
    use_pangolin: true 
    use_opencv_viewer: false
    use_disable_for_monocular: false
