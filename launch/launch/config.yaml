# Configurazione per RealSense D435i (640x480)
Camera:
  name: "RealSense D435i"
  setup: "RGBD"
  model: "perspective"
  fx: 644.0   # Aumentato proporzionalmente
  fy: 644.0
  cx: 640.0   # Metà di 1280
  cy: 360.0   # Metà di 720
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0
  fps: 30.0
  cols: 1280
  rows: 720
  color_order: "RGB"

Feature:
  max_num_keypoints: 2000
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Depth:
  min_depth: 0.5
  max_depth: 5.0